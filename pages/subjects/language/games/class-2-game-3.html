<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grammar Guru - VidyaSetu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .word-tile {
      background-color: #f472b6;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-weight: bold;
      cursor: grab;
      transition: transform 0.3s ease;
    }
    .word-tile:hover {
      transform: scale(1.1);
    }
    .drop-zone {
      border: 2px dashed #f9a8d4;
      border-radius: 1rem;
      padding: 1rem;
      min-height: 100px;
      transition: background 0.3s ease;
      font-size: 1rem;
      font-weight: bold;
      background-color: #fff;
    }
    .drop-zone.hovered {
      background-color: #ffe4f0;
    }
    .drop-zone.matched {
      background-color: #bbf7d0;
      border-color: #22c55e;
    }
    .hidden { display: none; }
  </style>
</head>
<body class="bg-gradient-to-r from-pink-50 via-white to-pink-100 text-center pt-20">

  <h1 class="text-3xl font-bold text-pink-700 mb-2">🧠 Grammar Guru</h1>
  <p class="text-gray-600 mb-4">Drag each word to the correct category: Noun, Verb, or Adjective!</p>
  <div class="text-lg text-pink-800 font-semibold mb-6">Score: <span id="score">0</span> / 5</div>

  <div id="roundText" class="text-xl font-semibold text-pink-800 mb-6"></div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 px-4 mb-6" id="dropContainer">
    <div class="drop-zone" data-type="noun">🧺 Noun</div>
    <div class="drop-zone" data-type="verb">🏃 Verb</div>
    <div class="drop-zone" data-type="adjective">🎨 Adjective</div>
  </div>

  <div id="wordBank" class="flex flex-wrap justify-center gap-4 mb-6 px-4"></div>

  <div id="feedback" class="text-lg font-medium text-green-700 mb-4 hidden"></div>
  <button id="nextBtn" class="hidden bg-gradient-to-r from-pink-500 to-pink-600 text-white px-6 py-2 rounded-full" onclick="nextRound()">Next</button>
  <div id="result" class="text-xl font-bold text-green-700 hidden mt-10"></div>

  <script>
    const rounds = [
      { words: { apple: "noun", run: "verb", red: "adjective" } },
      { words: { dog: "noun", jump: "verb", happy: "adjective" } },
      { words: { book: "noun", swim: "verb", bright: "adjective" } },
      { words: { car: "noun", sing: "verb", loud: "adjective" } },
      { words: { tree: "noun", dance: "verb", green: "adjective" } }
    ];

    const praise = ["Great job! 🎉", "Grammar genius! 🌟", "Awesome! 👍", "Superb! 🥳", "Well done! 💯"];
    let currentRound = 0;
    let score = 0;
    let matched = 0;

    const scoreEl = document.getElementById('score');
    const roundText = document.getElementById('roundText');
    const dropZones = document.querySelectorAll('.drop-zone');
    const wordBank = document.getElementById('wordBank');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const resultEl = document.getElementById('result');

    function loadRound() {
      feedbackEl.classList.add('hidden');
      nextBtn.classList.add('hidden');
      wordBank.innerHTML = '';
      dropZones.forEach(zone => {
        zone.innerHTML = zone.dataset.type === "noun" ? "🧺 Noun" :
                         zone.dataset.type === "verb" ? "🏃 Verb" :
                         "🎨 Adjective";
        zone.classList.remove('matched');
      });
      matched = 0;

      const round = rounds[currentRound];
      roundText.textContent = `Round ${currentRound + 1} of ${rounds.length}`;

      const shuffledWords = Object.keys(round.words).sort(() => Math.random() - 0.5);
      shuffledWords.forEach(word => {
        const tile = document.createElement('div');
        tile.className = 'word-tile';
        tile.draggable = true;
        tile.dataset.word = word;
        tile.dataset.type = round.words[word];
        tile.textContent = word.charAt(0).toUpperCase() + word.slice(1);
        wordBank.appendChild(tile);

        tile.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', JSON.stringify({ word, type: tile.dataset.type }));
        });
      });

      dropZones.forEach(zone => {
        zone.addEventListener('dragover', e => {
          e.preventDefault();
          zone.classList.add('hovered');
        });

        zone.addEventListener('dragleave', () => {
          zone.classList.remove('hovered');
        });

        zone.addEventListener('drop', e => {
          e.preventDefault();
          const data = JSON.parse(e.dataTransfer.getData('text/plain'));
          if (data.type === zone.dataset.type) {
            zone.classList.add('matched');
            zone.innerHTML += `<div class="mt-2 text-green-600 font-bold">${data.word} ✅</div>`;
            document.querySelector(`[data-word="${data.word}"]`).remove();
            matched++;
            zone.classList.remove('hovered');
            if (matched === Object.keys(round.words).length) {
              score++;
              scoreEl.textContent = score;
              feedbackEl.textContent = praise[Math.floor(Math.random() * praise.length)];
              feedbackEl.classList.remove('hidden');
              nextBtn.classList.remove('hidden');
            }
          } else {
            feedbackEl.textContent = `Oops! ❌ "${data.word}" doesn't belong in ${zone.dataset.type}`;
            feedbackEl.classList.remove('hidden');
            zone.classList.remove('hovered');
          }
        });
      });
    }

    function nextRound() {
      currentRound++;
      if (currentRound < rounds.length) {
        loadRound();
      } else {
        showResult();
      }
    }

    function showResult() {
      roundText.textContent = '';
      wordBank.innerHTML = '';
      feedbackEl.classList.add('hidden');
      nextBtn.classList.add('hidden');
      resultEl.classList.remove('hidden');
      resultEl.textContent = `🎯 Game Over! You scored ${score} out of ${rounds.length}`;
    }

    loadRound();
  </script>
</body>
</html>
