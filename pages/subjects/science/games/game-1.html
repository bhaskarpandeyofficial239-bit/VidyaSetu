<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Think & Tap - Class 1 Science</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .item-box {
      font-size: 4rem;
      padding: 20px;
      border-radius: 12px;
      background-color: #fef9c3;
      border: 3px solid #facc15;
      display: inline-block;
      margin-bottom: 20px;
    }
    .btn {
      padding: 10px 20px;
      margin: 10px;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-yes { background-color: #34d399; color: white; }
    .btn-no { background-color: #f87171; color: white; }
    .hidden { display: none; }
  </style>
</head>
<body class="bg-gradient-to-r from-yellow-50 via-white to-yellow-100 text-center pt-28 pb-20">

  <h1 class="text-4xl font-bold text-yellow-600 mb-4">🧠 Think & Tap</h1>
  <p class="text-gray-600 mb-6 text-lg">Tap ✅ if the item is Living, ❌ if it's Non-Living.</p>

  <div id="game-area">
    <div id="item" class="item-box">🐶</div>
    <div>
      <button class="btn btn-yes" onclick="checkAnswer(true)">✅ Living</button>
      <button class="btn btn-no" onclick="checkAnswer(false)">❌ Non-Living</button>
    </div>
    <div id="feedback" class="mt-4 text-xl font-medium"></div>
  </div>

  <div id="final-screen" class="hidden mt-10">
    <h2 class="text-3xl font-bold text-green-600">🎉 Game Over!</h2>
    <p id="final-score" class="mt-4 text-xl text-gray-700"></p>
    <button onclick="location.href='game-2.html'" class="mt-6 bg-yellow-500 text-white px-6 py-2 rounded-full">Next Chapter ➡️</button>
  </div>

  <script>
    const items = [
      { emoji: "🐶", isLiving: true },
      { emoji: "🪨", isLiving: false },
      { emoji: "🌳", isLiving: true },
      { emoji: "🏀", isLiving: false },
      { emoji: "🐦", isLiving: true },
      { emoji: "🚗", isLiving: false },
      { emoji: "🐠", isLiving: true },
      { emoji: "🧸", isLiving: false },
      { emoji: "🍎", isLiving: true },
      { emoji: "🧊", isLiving: false }
    ];

    let currentIndex = 0;
    let score = 0;

    function showItem() {
      document.getElementById("item").textContent = items[currentIndex].emoji;
      document.getElementById("feedback").textContent = "";
    }

    function checkAnswer(userSaysLiving) {
      const correct = items[currentIndex].isLiving === userSaysLiving;
      const feedback = document.getElementById("feedback");
      if (correct) {
        score++;
        feedback.textContent = "✅ Correct!";
        feedback.classList.add("text-green-600");
        feedback.classList.remove("text-red-600");
      } else {
        feedback.textContent = "❌ Oops! That was " + (items[currentIndex].isLiving ? "Living." : "Non-Living.");
        feedback.classList.add("text-red-600");
        feedback.classList.remove("text-green-600");
      }

      currentIndex++;
      if (currentIndex < items.length) {
        setTimeout(showItem, 1000);
      } else {
        setTimeout(showFinalScreen, 1500);
      }
    }

    function showFinalScreen() {
      document.getElementById("game-area").classList.add("hidden");
      document.getElementById("final-screen").classList.remove("hidden");
      document.getElementById("final-score").textContent = `You got ${score} out of ${items.length} correct! 🌟`;
    }

    showItem();
  </script>

</body>
</html>
