<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Journey Through the Body – Biology Adventure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .choice-btn {
      background-color: #3b82f6;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      margin: 5px;
      cursor: pointer;
    }
    .choice-btn:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body class="bg-gradient-to-r from-blue-50 via-white to-blue-100 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
      <h2 class="text-xl font-bold text-blue-600">🧬 Journey Through the Body</h2>
      <a href="../../../../index.html" class="text-blue-500 hover:underline">← Back to Biology Chapters</a>
    </div>
  </header>

  <!-- Game Container -->
  <main class="max-w-3xl mx-auto py-12 px-4 text-center">
    <h1 class="text-3xl font-bold text-blue-700 mb-4">🚀 Begin Your Biology Adventure</h1>
    <p class="text-gray-600 mb-6">Make the right choices to travel safely through the human body!</p>

    <div id="scene" class="p-6 bg-white rounded shadow">
      <!-- Scene content will be injected here -->
    </div>

    <div id="feedback" class="mt-6 text-lg font-semibold"></div>
    <div id="scoreDisplay" class="mt-2 text-blue-700 font-medium">Score: 0</div>
  </main>

  <!-- Footer -->
  <footer class="bg-blue-700 text-white py-6 text-center">
    <p>Made with ❤️ for Nabha Students | Powered by SIH</p>
  </footer>

  <!-- Game Script -->
  <script>
    let score = 0;
    let currentScene = 0;

    const scenes = [
      {
        title: "🌊 You’ve entered the stomach!",
        question: "Which enzyme is active here to break down proteins?",
        choices: {
          A: { text: "Pepsin", correct: true, fact: "Pepsin thrives in the acidic environment and begins protein digestion." },
          B: { text: "Amylase", correct: false, fact: "Amylase breaks down starch, not proteins." },
          C: { text: "Lipase", correct: false, fact: "Lipase breaks down fats, not proteins." },
          D: { text: "Trypsin", correct: false, fact: "Trypsin works in the small intestine, not the stomach." }
        }
      },
      {
        title: "🌀 You’ve reached the small intestine!",
        question: "What is the main function of the small intestine?",
        choices: {
          A: { text: "Absorb nutrients", correct: true, fact: "The small intestine absorbs nutrients into the bloodstream." },
          B: { text: "Store waste", correct: false, fact: "Waste is stored in the large intestine." },
          C: { text: "Produce bile", correct: false, fact: "Bile is produced by the liver." },
          D: { text: "Break down starch", correct: false, fact: "Starch is broken down earlier in digestion." }
        }
      },
      {
        title: "🧠 You’ve entered the brain!",
        question: "Which part of the brain controls balance and coordination?",
        choices: {
          A: { text: "Cerebrum", correct: false, fact: "Cerebrum controls thinking and memory." },
          B: { text: "Cerebellum", correct: true, fact: "Cerebellum controls balance and coordination." },
          C: { text: "Medulla", correct: false, fact: "Medulla controls involuntary actions like breathing." },
          D: { text: "Spinal cord", correct: false, fact: "Spinal cord transmits signals, not balance." }
        }
      }
    ];

    function loadScene(index) {
      const scene = scenes[index];
      const container = document.getElementById("scene");
      const feedback = document.getElementById("feedback");
      feedback.innerHTML = "";

      let html = `<h2 class="text-2xl font-bold text-blue-700">${scene.title}</h2>`;
      html += `<p class="mt-4 text-gray-700">${scene.question}</p>`;
      html += `<div class="mt-6 space-y-2">`;

      for (const key in scene.choices) {
        html += `<button class="choice-btn" onclick="checkAnswer('${key}')">${key}. ${scene.choices[key].text}</button><br>`;
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function checkAnswer(choiceKey) {
      const scene = scenes[currentScene];
      const choice = scene.choices[choiceKey];
      const feedback = document.getElementById("feedback");

      if (choice.correct) {
        score += 10;
        feedback.innerHTML = `✅ Correct! ${choice.fact}`;
        feedback.className = "text-green-600";
      } else {
        score -= 5;
        feedback.innerHTML = `❌ Incorrect. ${choice.fact}`;
        feedback.className = "text-red-600";
      }

      document.getElementById("scoreDisplay").innerText = `Score: ${score}`;

      currentScene++;
      if (currentScene < scenes.length) {
        setTimeout(() => loadScene(currentScene), 2000);
      } else {
        setTimeout(() => {
          document.getElementById("scene").innerHTML = `<h2 class="text-2xl font-bold text-green-600">🎉 Adventure Complete!</h2><p class="mt-4 text-gray-700">You scored ${score} points. Great job exploring the human body!</p>`;
          document.getElementById("feedback").innerHTML = "";
        }, 2000);
      }
    }

    window.onload = () => loadScene(currentScene);
  </script>
</body>
</html>
