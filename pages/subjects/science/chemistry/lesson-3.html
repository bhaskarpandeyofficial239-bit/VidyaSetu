<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Detectives – Physical vs Chemical</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .btn {
      background-color: #10b981;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #059669;
    }
    .case-box {
      background-color: #d1fae5;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #6ee7b7;
    }
    .animation {
      font-size: 48px;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body class="bg-gradient-to-r from-green-50 via-white to-green-100 text-gray-800">

  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between p-4">
      <h2 class="text-xl font-bold text-green-600">🕵️ Change Detectives – Physical vs Chemical</h2>
      <a href="../../../../index.html" class="text-green-500 hover:underline">← Back to Chemistry Chapters</a>
    </div>
  </header>

  <!-- Game Container -->
  <main class="max-w-3xl mx-auto py-12 px-4 text-center">
    <h1 class="text-3xl font-bold text-green-700 mb-4">🔍 Solve the Mystery!</h1>
    <p class="text-gray-600 mb-6">Decide whether each change is physical or chemical to crack the case!</p>

    <div id="gameBox" class="case-box">
      <!-- Game content will be injected here -->
    </div>

    <div id="feedback" class="mt-6 text-lg font-semibold"></div>
    <div id="scoreDisplay" class="mt-2 text-green-700 font-medium">Score: 0</div>
  </main>

  <!-- Footer -->
  <footer class="bg-green-700 text-white py-6 text-center">
    <p>Made with ❤️ for Nabha Students | Powered by SIH</p>
  </footer>

  <!-- Game Script -->
  <script>
    let score = 0;
    let caseIndex = 0;

    const cases = [
      {
        title: "🧊 Case 1: Melting Ice",
        animation: "❄️",
        scenario: "You see an ice cube turning into water. What kind of change is this?",
        options: {
          A: { text: "Physical Change", correct: true, fact: "Melting is a physical change—no new substance is formed." },
          B: { text: "Chemical Change", correct: false, fact: "No chemical reaction occurs here." }
        }
      },
      {
        title: "🧪 Case 2: Rusting Iron",
        animation: "🧲",
        scenario: "An iron nail left outside turns reddish-brown. What kind of change is this?",
        options: {
          A: { text: "Physical Change", correct: false, fact: "Rusting forms a new substance—iron oxide." },
          B: { text: "Chemical Change", correct: true, fact: "Rusting is a chemical change due to reaction with oxygen and moisture." }
        }
      },
      {
        title: "🔥 Case 3: Burning Paper",
        animation: "🔥",
        scenario: "You burn a piece of paper and it turns to ash. What kind of change is this?",
        options: {
          A: { text: "Physical Change", correct: false, fact: "Burning creates new substances like ash and gases." },
          B: { text: "Chemical Change", correct: true, fact: "Burning is a chemical change involving combustion." }
        }
      }
    ];

    function loadCase(index) {
      const caseData = cases[index];
      const gameBox = document.getElementById("gameBox");
      const feedback = document.getElementById("feedback");
      feedback.innerHTML = "";

      let html = `<div class="animation">${caseData.animation}</div>`;
      html += `<h2 class="text-2xl font-bold text-green-700 mt-2">${caseData.title}</h2>`;
      html += `<p class="mt-2 text-gray-700">${caseData.scenario}</p>`;
      html += `<div class="mt-4 space-y-2">`;

      for (const key in caseData.options) {
        html += `<button class="btn" onclick="checkAnswer('${key}')">${key}. ${caseData.options[key].text}</button><br>`;
      }

      html += `</div>`;
      gameBox.innerHTML = html;
    }

    function checkAnswer(choiceKey) {
      const caseData = cases[caseIndex];
      const choice = caseData.options[choiceKey];
      const feedback = document.getElementById("feedback");

      if (choice.correct) {
        score += 10;
        feedback.innerHTML = `✅ Correct! ${choice.fact}`;
        feedback.className = "text-green-600";
      } else {
        score -= 5;
        feedback.innerHTML = `❌ Incorrect. ${choice.fact}`;
        feedback.className = "text-red-600";
      }

      document.getElementById("scoreDisplay").innerText = `Score: ${score}`;

      caseIndex++;
      if (caseIndex < cases.length) {
        setTimeout(() => loadCase(caseIndex), 2000);
      } else {
        setTimeout(() => {
          document.getElementById("gameBox").innerHTML = `<h2 class="text-2xl font-bold text-green-600">🎉 Case Closed!</h2><p class="mt-4 text-gray-700">Final Score: ${score} points. You’re a certified Change Detective!</p>`;
          document.getElementById("feedback").innerHTML = "";
        }, 2000);
      }
    }

    window.onload = () => loadCase(caseIndex);
  </script>
</body>
</html>
